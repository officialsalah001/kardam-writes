<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Article | Hamza S.S Kardam Writes</title><meta name="description" content="Article from Hamza S.S Kardam Writes"><link rel="stylesheet" href="style.css"><style>.articlePage{width:min(850px,92%);margin:60px auto}.articleMeta{color:#687386;font-size:12px}.articleContent{font-size:18px;line-height:1.9;white-space:pre-wrap}.articleHero{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin:20px 0}.back{display:inline-block;margin-bottom:15px}</style></head><body><header><div class="wrap nav"><a class="logo" href="index.html"><i>K</i><span>Hamza S.S<small>KARDAM WRITES</small></span></a><a class="wa" href="https://wa.me/2347077777636">WhatsApp</a></div></header><main class="articlePage"><a class="back" href="index.html#articles">← Back to articles</a><div id="state">Loading article…</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script>
(async()=>{const id=new URLSearchParams(location.search).get('id'),state=document.getElementById('state');if(!id||!window.kardamSupabase){state.textContent='Article unavailable.';return}const sb=window.kardamSupabase;const {data,error}=await sb.from('articles').select('*').eq('id',id).eq('status','published').single();if(error||!data){state.textContent='Article not found.';return}document.title=data.title+' | Hamza S.S Kardam Writes';state.innerHTML=`<div class="articleMeta">${data.category_slug} · ${new Date(data.created_at).toLocaleDateString()}</div><h1>${esc(data.title)}</h1>${data.image_url?`<img class="articleHero" src="${esc(data.image_url)}" alt="">`:''}<p>${esc(data.excerpt||'')}</p><div class="articleContent">${esc(data.content)}</div><p class="articleMeta">Views: <span id="views">${data.views||0}</span></p>`;const {data:v}=await sb.rpc('increment_article_view',{article_id:Number(id)});if(v!==null)document.getElementById('views').textContent=v;})();function esc(s=''){return String(s).replace(/[&<>'"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[m]))}</script></body></html>
