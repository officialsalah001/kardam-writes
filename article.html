<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Article | Hamza S.S Kardam Writes</title>
<meta name="description" content="Read articles from Hamza S.S Kardam Writes.">
<meta name="robots" content="index,follow">
<link rel="stylesheet" href="style.css">
<style>
.articlePage{width:min(850px,92%);margin:60px auto}
.articleMeta{color:#687386;font-size:12px}
.articleContent{font-size:18px;line-height:1.9;white-space:pre-wrap}
.articleHero{width:100%;max-height:430px;object-fit:cover;border-radius:14px;margin:20px 0}
.back{display:inline-block;margin-bottom:15px}
</style>
</head>
<body>

<header>
<div class="wrap nav">
<a class="logo" href="index.html"><i>K</i><span>Hamza S.S<small>KARDAM WRITES</small></span></a>
<a class="wa" href="https://wa.me/2347077777636">WhatsApp</a>
</div>
</header>

<main class="articlePage">
<a class="back" href="index.html#articles">← Back to articles</a>
<div id="state">Loading article...</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>

<script>
(async function(){

const state=document.getElementById("state");
const id=new URLSearchParams(window.location.search).get("id");

if(!id){
state.innerHTML="<h2>Article not found</h2><p>No article was selected.</p>";
return;
}

if(!window.kardamSupabase){
state.innerHTML="<h2>Connection error</h2><p>Database connection is unavailable.</p>";
return;
}

try{

const sb=window.kardamSupabase;

const result=await sb
.from("articles")
.select("*")
.eq("id",id)
.eq("status","published")
.single();

if(result.error){
console.error(result.error);
state.innerHTML="<h2>Unable to load article</h2><p>The article could not be loaded from the database.</p>";
return;
}

if(!result.data){
state.innerHTML="<h2>Article not found</h2><p>This article is not available.</p>";
return;
}

const a=result.data;

document.title=(a.title||"Article")+" | Hamza S.S Kardam Writes";

const description=String(a.excerpt||a.content||"").substring(0,155);
document.querySelector('meta[name="description"]').content=description;

state.innerHTML=
'<div class="articleMeta">'+
esc(a.category_slug||"Article")+
" · "+
new Date(a.created_at).toLocaleDateString()+
"</div>"+
"<h1>"+esc(a.title||"Untitled Article")+"</h1>"+
(a.image_url?
'<img class="articleHero" src="'+esc(a.image_url)+'" alt="'+esc(a.title||"Article")+'">'
:"")+
(a.excerpt?
"<p>"+esc(a.excerpt)+"</p>"
:"")+
'<div class="articleContent">'+
esc(a.content||"")+
"</div>"+
'<p class="articleMeta">Views: <span id="views">'+
(a.views||0)+
"</span></p>";

try{
const view=await sb.rpc("increment_article_view",{article_id:Number(id)});
if(view.data!==null){
document.getElementById("views").textContent=view.data;
}
}catch(viewError){
console.warn("View counter unavailable:",viewError);
}

}catch(error){

console.error("Article error:",error);

state.innerHTML=
"<h2>Unable to load article</h2>"+
"<p>Please try again later.</p>";

}

function esc(value){
return String(value).replace(/[&<>'"]/g,function(char){
return{
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[char];
});
}

})();
</script>

</body>
</html>
