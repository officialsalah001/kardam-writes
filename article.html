(function(){

const state =
document.getElementById("state");


/* =========================
   GET ARTICLE ID
========================= */

const id =
new URLSearchParams(
window.location.search
).get("id");


if(!id){

state.innerHTML =
"<h2>Article not found</h2>"+
"<p>No article was selected.</p>";

return;

}


/* =========================
   SUPABASE CHECK
========================= */

if(!window.kardamSupabase){

state.innerHTML =
"<h2>Connection error</h2>"+
"<p>Database connection is unavailable.</p>";

return;

}


const sb =
window.kardamSupabase;


/* =========================
   ESCAPE HTML
========================= */

function esc(value=""){

return String(value).replace(
/[&<>'"]/g,
function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[m];

});

}


/* =========================
   DATE
========================= */

function formatDate(date){

if(!date) return "";

try{

return new Date(date).toLocaleDateString(
"en-US",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}catch(e){

return "";

}

}


/* =========================
   CATEGORY LABEL
========================= */

function categoryLabel(category){

const labels = {

news:"📰 News / Labarai",

politics:"🏛️ Politics / Siyasa",

sports:"⚽ Sports / Wasanni",

education:"📚 Ilimi / Education",

history:"📜 Tarihi / History",

lifestyle:"🌍 Rayuwa / Lifestyle",

technology:"💻 Fasaha / Technology",

business:"💼 Business / Kasuwanci",

opinion:"💭 Opinion / Ra'ayi"

};

return labels[category] ||
category ||
"Article";

}


/* =========================
   VISITOR ID
========================= */

function getVisitorId(){

const key =
"kardam_writes_visitor_id";

let visitorId =
localStorage.getItem(key);

if(!visitorId){

if(
window.crypto &&
typeof window.crypto.randomUUID === "function"
){

visitorId =
window.crypto.randomUUID();

}else{

visitorId =
"visitor_" +
Date.now() +
"_" +
Math.random()
.toString(36)
.substring(2);

}

localStorage.setItem(
key,
visitorId
);

}

return visitorId;

}


/* =========================
   LOAD ARTICLE
========================= */

async function loadArticle(){

try{

const result =
await sb
.from("articles")
.select("*")
.eq("id",id)
.eq("status","published")
.single();


if(result.error){

console.error(
"Article load error:",
result.error
);

state.innerHTML =
"<h2>Unable to load article</h2>"+
"<p>The article could not be loaded from the database.</p>";

return;

}


if(!result.data){

state.innerHTML =
"<h2>Article not found</h2>"+
"<p>This article is not available.</p>";

return;

}


const a =
result.data;


/* =========================
   SEO
========================= */

document.title =
(a.title || "Article")+
" | Hamza S.S Kardam Writes";


const description =
String(
a.excerpt ||
a.content ||
""
)
.replace(/\s+/g," ")
.substring(0,155);


const metaDescription =
document.querySelector(
'meta[name="description"]'
);


if(metaDescription){

metaDescription.content =
description;

}


/* =========================
   ARTICLE IMAGE
========================= */

let imageHTML = "";


if(a.image_url){

imageHTML =

'<img '+
'class="articleHero" '+
'src="'+
esc(a.image_url)+
'" '+
'alt="'+
esc(a.title || "Article")+
'" '+
'loading="eager" '+
'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'+

'<div '+
'class="articleImageFallback" '+
'style="display:none">'+

esc(
String(
a.category_slug ||
"ARTICLE"
).toUpperCase()
)+

"</div>";

}


/* =========================
   ARTICLE HTML
========================= */

state.innerHTML =

'<div class="articleMeta">'+

esc(
categoryLabel(
String(
a.category_slug || ""
).toLowerCase()
)
)+

" · "+

formatDate(a.created_at)+

"</div>"+


"<h1>"+
esc(
a.title ||
"Untitled Article"
)+
"</h1>"+


imageHTML+


(
a.excerpt
?

'<p class="articleExcerpt">'+
esc(a.excerpt)+
"</p>"

:

""

)+


'<div class="articleContent">'+

esc(
a.content ||
""
)+

"</div>"+


'<div class="articleStats">'+

'<div class="articleStat">'+

"👁️ Views: <b id=\"views\">"+
esc(a.views || 0)+
"</b>"+

"</div>"+


'<div class="articleStat">'+

"💬 Comments: <b id=\"commentCount\">0</b>"+

"</div>"+

"</div>"+


'<div class="likeBox">'+

'<button '+
'type="button" '+
'class="likeButton" '+
'id="likeButton">'+

'<span class="likeIcon" id="likeIcon">👍</span>'+

'<span id="likeText">Like</span>'+

"</button>"+

'<span class="likeCount" id="likeCount">0 likes</span>'+

'<span class="likeStatus" id="likeStatus"></span>'+

"</div>";


/* =========================
   INCREMENT VIEW
========================= */

try{

const viewResult =
await sb.rpc(
"increment_article_view",
{
article_id:Number(id)
}
);


if(viewResult.error){

console.warn(
"View counter error:",
viewResult.error
);

}else{

const viewElement =
document.getElementById("views");


if(
viewElement &&
viewResult.data !== null &&
viewResult.data !== undefined
){

viewElement.textContent =
Number(viewResult.data)
.toLocaleString();

}

}

}catch(viewError){

console.warn(
"View counter unavailable:",
viewError
);

}


/* =========================
   LIKE SYSTEM
========================= */

await setupLikes(
sb,
Number(id)
);


/* =========================
   COMMENTS
========================= */

await renderComments(
sb,
Number(id)
);

}catch(error){

console.error(
"Article error:",
error
);

state.innerHTML =
"<h2>Unable to load article</h2>"+
"<p>Please try again later.</p>";

}

}


/* =========================
   LIKE SYSTEM
========================= */

async function setupLikes(
sb,
articleId
){

const button =
document.getElementById(
"likeButton"
);


const icon =
document.getElementById(
"likeIcon"
);


const text =
document.getElementById(
"likeText"
);


const count =
document.getElementById(
"likeCount"
);


const status =
document.getElementById(
"likeStatus"
);


if(
!button ||
!icon ||
!text ||
!count
){

return;

}


let visitorId;


try{

visitorId =
getVisitorId();

}catch(error){

console.error(
"Visitor ID error:",
error
);

return;

}


/* =========================
   LOAD LIKE STATE
========================= */

async function loadLikeState(){

try{

const totalResult =
await sb
.from("article_likes")
.select(
"id",
{
count:"exact",
head:true
}
)
.eq(
"article_id",
articleId
);


if(totalResult.error){

console.error(
"Like count error:",
totalResult.error
);

count.textContent =
"0 likes";

}else{

count.textContent =
Number(
totalResult.count || 0
).toLocaleString()+
" "+
(
Number(totalResult.count || 0) === 1
? "like"
: "likes"
);

}


/* =========================
   CHECK CURRENT VISITOR
========================= */

const mineResult =
await sb
.from("article_likes")
.select("id")
.eq(
"article_id",
articleId
)
.eq(
"visitor_id",
visitorId
)
.limit(1);


if(mineResult.error){

console.error(
"Like state error:",
mineResult.error
);

return;

}


const liked =
Array.isArray(mineResult.data) &&
mineResult.data.length > 0;


if(liked){

button.classList.add("liked");

icon.textContent =
"❤️";

text.textContent =
"Liked";

}else{

button.classList.remove("liked");

icon.textContent =
"👍";

text.textContent =
"Like";

}

}catch(error){

console.error(
"Like loading error:",
error
);

}

}


/* =========================
   LIKE / UNLIKE
========================= */

button.addEventListener(
"click",
async function(){

button.disabled =
true;

status.textContent =
"";


const alreadyLiked =
button.classList.contains(
"liked"
);


try{

if(alreadyLiked){

status.textContent =
"Removing like...";


const deleteResult =
await sb
.from("article_likes")
.delete()
.eq(
"article_id",
articleId
)
.eq(
"visitor_id",
visitorId
);


if(deleteResult.error){

console.error(
"Unlike error:",
deleteResult.error
);

status.textContent =
"Unable to remove like.";

return;

}

}else{

status.textContent =
"Liking...";


const insertResult =
await sb
.from("article_likes")
.insert({

article_id:
articleId,

visitor_id:
visitorId

});


if(insertResult.error){

/*
If the visitor already liked the article,
the unique constraint prevents a duplicate.
*/

if(
insertResult.error.code === "23505"
){

console.warn(
"Like already exists."
);

}else{

console.error(
"Like insert error:",
insertResult.error
);

status.textContent =
"Unable to like this article.";

return;

}

}

}


/* =========================
   REFRESH LIKE DISPLAY
========================= */

await loadLikeState();

status.textContent =
"";


}catch(error){

console.error(
"Like action error:",
error
);

status.textContent =
"Something went wrong. Please try again.";

}finally{

button.disabled =
false;

}

});


await loadLikeState();

}


/* =========================
   COMMENTS SYSTEM
========================= */

async function renderComments(
sb,
articleId
){

const box =
document.createElement("section");


box.className =
"comments";


box.innerHTML =

'<h2>💬 Comments / Ra’ayoyi</h2>'+


'<p class="commentIntro">'+

"Ka bar ra’ayinka a kasa. "+

"Comment ɗinka zai bayyana kai tsaye bayan ka tura shi."

+"</p>"+


'<form '+
'class="commentForm" '+
'id="commentForm">'+


'<label>'+

"Name"+

'<input '+
'id="commentName" '+
'type="text" '+
'maxlength="60" '+
'minlength="2" '+
'required '+
'autocomplete="name" '+
'placeholder="Your name">'+

"</label>"+


'<label>'+

"Email (optional)"+

'<input '+
'id="commentEmail" '+
'type="email" '+
'maxlength="120" '+
'autocomplete="email" '+
'placeholder="Your email (optional)">'+

"</label>"+


'<label>'+

"Comment / Ra’ayi"+

'<textarea '+
'id="commentText" '+
'maxlength="1000" '+
'minlength="2" '+
'required '+
'placeholder="Rubuta ra’ayinka a nan...">'+

"</textarea>"+"</label>"+

'<label class="honeypot" aria-hidden="true">'+

"Website"+

'<input '+
'id="website" '+
'tabindex="-1" '+
'autocomplete="off">'+

"</label>"+

'<button '+
'type="submit" '+
'id="commentButton">'+

"Post Comment"+

"</button>"+

'<div '+
'class="commentStatus" '+
'id="commentStatus">'+

"</div>"+

"</form>"+

'<div '+
'class="commentList" '+
'id="commentList">'+

'<div class="emptyComments">'+

"Loading comments..."+

"</div>"+

"</div>";

state.appendChild(box);

/* =========================
ELEMENTS
========================= */

const form =
document.getElementById(
"commentForm"
);

const nameInput =
document.getElementById(
"commentName"
);

const emailInput =
document.getElementById(
"commentEmail"
);

const textInput =
document.getElementById(
"commentText"
);

const spamInput =
document.getElementById(
"website"
);

const button =
document.getElementById(
"commentButton"
);

const status =
document.getElementById(
"commentStatus"
);

const list =
document.getElementById(
"commentList"
);

const countElement =
document.getElementById(
"commentCount"
);

/* =========================
LOAD COMMENTS
========================= */

async function loadComments(){

list.innerHTML =
'<div class="emptyComments">'+
"Loading comments..."+
"</div>";

try{

const result =
await sb
.from("comments")
.select(
"id,article_id,name,email,body,status,created_at"
)
.eq("article_id",articleId)
.eq("status","approved")
.order(
"created_at",
{
ascending:false
}
);

if(result.error){

console.error(
"Comments load error:",
result.error
);

list.innerHTML =
'<div class="commentError">'+
"Comments ba su samu connection da database ba a yanzu."+
"</div>";

if(countElement){

countElement.textContent =
"0";

}

return;

}

const comments =
result.data || [];

/* =========================
COMMENT COUNT
========================= */

if(countElement){

countElement.textContent =
comments.length
.toLocaleString();

}

if(!comments.length){

list.innerHTML =
'<div class="emptyComments">'+

"No comments yet. Be the first to comment!"+

"</div>";

return;

}

/* =========================
RENDER COMMENTS
========================= */

list.innerHTML =
comments.map(function(c){

return (

'<article class="commentItem">'+

"<strong>"+
esc(
c.name ||
"Anonymous"
)+
"</strong>"+

'<div class="commentDate">'+
formatDate(c.created_at)+
"</div>"+

'<div class="commentText">'+
esc(
c.body ||
""
)+
"</div>"+

"</article>"

);

}).join("");

}catch(error){

console.error(
"Comments error:",
error
);

list.innerHTML =
'<div class="commentError">'+
"Unable to load comments right now."+
"</div>";

}

}

/* =========================
POST COMMENT
========================= */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

status.textContent =
"";

status.style.color =
"";

const name =
nameInput.value.trim();

const email =
emailInput.value.trim();

const body =
textInput.value.trim();

/* =========================
HONEYPOT
========================= */

if(
spamInput.value.trim() !== ""
){

status.textContent =
"Comment could not be submitted.";

return;

}

/* =========================
NAME VALIDATION
========================= */

if(name.length < 2){

status.textContent =
"Please enter your name.";

return;

}

if(name.length > 60){

status.textContent =
"Name is too long.";

return;

}

/* =========================
EMAIL VALIDATION
========================= */

if(email.length > 120){

status.textContent =
"Email is too long.";

return;

}

if(
email &&
!/^[^\s@]+@[^\s@]+.[^\s@]+$/.test(email)
){

status.textContent =
"Please enter a valid email.";

return;

}

/* =========================
COMMENT VALIDATION
========================= */

if(body.length < 2){

status.textContent =
"Please write a comment.";

return;

}

if(body.length > 1000){

status.textContent =
"Comment is too long.";

return;

}

/* =========================
BUTTON
========================= */

button.disabled =
true;

button.textContent =
"Posting...";

status.textContent =
"Posting your comment...";

/* =========================
INSERT DIRECTLY
========================= */

try{

const result =
await sb
.from("comments")
.insert({

article_id:
articleId,

name:
name,

email:
email ||
null,

body:
body,

/*
IMPORTANT:
Comment is approved immediately.
*/

status:
"approved"

});

if(result.error){

console.error(
"Comment insert error:",
result.error
);

status.textContent =
"An samu matsala wajen posting comment. Please try again.";

status.style.color =
"#a33";

return;

}

/* =========================
SUCCESS
========================= */

status.textContent =
"✅ Comment posted successfully!";

status.style.color =
"#16803c";

/* Clear form */

form.reset();

/* Reload comments immediately */

await loadComments();

}catch(error){

console.error(
"Comment submit error:",
error
);

status.textContent =
"Unable to post comment right now.";

status.style.color =
"#a33";

}finally{

button.disabled =
false;

button.textContent =
"Post Comment";

}

});

/* =========================
INITIAL COMMENTS
========================= */

await loadComments();

}

/* =========================
START
========================= */

loadArticle();

})();

</script></body>
