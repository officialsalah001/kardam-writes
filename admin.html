<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kardam Admin</title><link rel="stylesheet" href="style.css"><style>.box{max-width:850px;margin:50px auto;padding:28px;background:#fff;border:1px solid #ddd;border-radius:12px}.box input,.box textarea{width:100%;padding:12px;margin:7px 0 15px;border:1px solid #ddd;border-radius:6px}.box textarea{min-height:180px}</style></head><body style="background:#f7f4ed"><div class="box"><a href="index.html">← Back to website</a><h1>Admin Dashboard</h1><p><b>Starter version.</b> Drafts are saved in this browser only. A real shared admin, database, comments and public views will need a backend/CMS.</p><label>Article title</label><input id="t"><label>Excerpt</label><textarea id="e"></textarea><label>Article body</label><textarea id="b"></textarea><button class="btn" onclick="save()">Save Draft</button><p id="s"></p></div><script>function save(){localStorage.kardamDraft=JSON.stringify({title:t.value,excerpt:e.value,body:b.value,date:new Date().toISOString()});s.textContent='Draft saved on this browser.'}</script></body></html>
