<html lang="en">
<head>
<meta charset="utf-8">

<title>Article | Hamza S.S Kardam Writes</title>

<meta name="description" content="Read articles from Hamza S.S Kardam Writes.">
<meta name="robots" content="index,follow">

<link rel="canonical"
href="https://officialsalah001.github.io/kardam-writes/article.html">

<link rel="stylesheet" href="style.css">

<style>

.articlePage{
  width:min(850px,92%);
  margin:60px auto;
}

.articleMeta{
  color:#687386;
  font-size:12px;
  margin-bottom:10px;
}

.articleContent{
  font-size:18px;
  line-height:1.9;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.articleHero{
  width:100%;
  max-height:430px;
  object-fit:cover;
  border-radius:14px;
  margin:20px 0;
}

.back{
  display:inline-block;
  margin-bottom:15px;
}

.articleExcerpt{
  font-size:17px;
  line-height:1.7;
  color:#4b5563;
  margin:15px 0 25px;
}

.articleStats{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-top:20px;
}

.articleStat{
  padding:9px 13px;
  border:1px solid #e4e6eb;
  border-radius:8px;
  background:#f8f9fb;
  color:#687386;
  font-size:12px;
}

.articleStat b{
  color:#0b1730;
}


/* =========================
   COMMENTS
========================= */

.comments{
  margin-top:45px;
  padding-top:30px;
  border-top:1px solid #e4e6eb;
}

.comments h2{
  margin-bottom:8px;
}

.commentIntro{
  color:#687386;
  line-height:1.6;
}

.commentForm{
  display:grid;
  gap:12px;
  margin:20px 0 30px;
}

.commentForm label{
  font-weight:700;
  font-size:14px;
}

.commentForm input,
.commentForm textarea{
  width:100%;
  box-sizing:border-box;
  margin-top:6px;
  padding:12px;
  border:1px solid #d9dde5;
  border-radius:8px;
  font:inherit;
  background:#fff;
}

.commentForm input:focus,
.commentForm textarea:focus{
  outline:2px solid #d7aa55;
  border-color:#d7aa55;
}

.commentForm textarea{
  min-height:120px;
  resize:vertical;
}

.commentForm button{
  justify-self:start;
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#0b1730;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.commentForm button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.commentStatus{
  font-size:13px;
  line-height:1.5;
}

.commentList{
  display:grid;
  gap:12px;
}

.commentItem{
  padding:16px;
  border:1px solid #e4e6eb;
  border-radius:10px;
  background:#fff;
}

.commentItem strong{
  display:block;
  margin-bottom:5px;
}

.commentDate{
  font-size:11px;
  color:#687386;
  margin-bottom:8px;
}

.commentText{
  white-space:pre-wrap;
  line-height:1.65;
  word-wrap:break-word;
}

.emptyComments{
  color:#687386;
  font-size:14px;
}

.commentError{
  padding:12px;
  border-radius:8px;
  background:#fff3f3;
  color:#8b1e1e;
  font-size:13px;
}


/* =========================
   HIDDEN ANTI-SPAM
========================= */

.honeypot{
  position:absolute!important;
  left:-9999px!important;
  width:1px!important;
  height:1px!important;
  overflow:hidden!important;
}


/* =========================
   IMAGE FALLBACK
========================= */

.articleImageFallback{
  width:100%;
  min-height:220px;
  border-radius:14px;
  margin:20px 0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#14243f,#4c78a7);
  color:#fff;
  font-size:12px;
  font-weight:700;
  letter-spacing:2px;
}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

.articlePage{
  margin:35px auto;
}

.articleContent{
  font-size:16px;
  line-height:1.8;
}

.articleExcerpt{
  font-size:16px;
}

.articleHero{
  max-height:300px;
}

.articleStats{
  gap:7px;
}

}

</style>
</head>


<body>


<header>

<div class="wrap nav">

<a class="logo" href="index.html">

<i>K</i>

<span>
Hamza S.S
<small>KARDAM WRITES</small>
</span>

</a>

<a class="wa" href="https://wa.me/2347077777636">
WhatsApp
</a>

</div>

</header>


<main class="articlePage">

<a class="back" href="index.html#articles">
← Back to articles
</a>

<div id="state">
Loading article...
</div>

</main>


<!-- =========================
     SUPABASE
========================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="supabase-config.js"></script>

<script src="supabase-client.js"></script>


<script>

(function(){

const state =
document.getElementById("state");


/* =========================
   GET ARTICLE ID
========================= */

const id =
new URLSearchParams(
window.location.search
).get("id");


if(!id){

state.innerHTML =
"<h2>Article not found</h2>"+
"<p>No article was selected.</p>";

return;

}


/* =========================
   SUPABASE CHECK
========================= */

if(!window.kardamSupabase){

state.innerHTML =
"<h2>Connection error</h2>"+
"<p>Database connection is unavailable.</p>";

return;

}


const sb =
window.kardamSupabase;


/* =========================
   ESCAPE HTML
========================= */

function esc(value=""){

return String(value).replace(
/[&<>'"]/g,
function(m){

return {

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"

}[m];

});

}


/* =========================
   DATE
========================= */

function formatDate(date){

if(!date) return "";

try{

return new Date(date).toLocaleDateString(
"en-US",
{
year:"numeric",
month:"long",
day:"numeric"
}
);

}catch(e){

return "";

}

}


/* =========================
   CATEGORY LABEL
========================= */

function categoryLabel(category){

const labels = {

news:"📰 News / Labarai",

politics:"🏛️ Politics / Siyasa",

sports:"⚽ Sports / Wasanni",

education:"📚 Ilimi / Education",

history:"📜 Tarihi / History",

lifestyle:"🌍 Rayuwa / Lifestyle",

technology:"💻 Fasaha / Technology",

business:"💼 Business / Kasuwanci",

opinion:"💭 Opinion / Ra'ayi"

};

return labels[category] ||
category ||
"Article";

}


/* =========================
   LOAD ARTICLE
========================= */

async function loadArticle(){

try{

const result =
await sb
.from("articles")
.select("*")
.eq("id",id)
.eq("status","published")
.single();


if(result.error){

console.error(
"Article load error:",
result.error
);

state.innerHTML =
"<h2>Unable to load article</h2>"+
"<p>The article could not be loaded from the database.</p>";

return;

}


if(!result.data){

state.innerHTML =
"<h2>Article not found</h2>"+
"<p>This article is not available.</p>";

return;

}


const a =
result.data;


/* =========================
   SEO
========================= */

document.title =
(a.title || "Article")+
" | Hamza S.S Kardam Writes";


const description =
String(
a.excerpt ||
a.content ||
""
)
.replace(/\s+/g," ")
.substring(0,155);


const metaDescription =
document.querySelector(
'meta[name="description"]'
);


if(metaDescription){

metaDescription.content =
description;

}


/* =========================
   ARTICLE IMAGE
========================= */

let imageHTML = "";


if(a.image_url){

imageHTML =

'<img '+
'class="articleHero" '+
'src="'+
esc(a.image_url)+
'" '+
'alt="'+
esc(a.title || "Article")+
'" '+
'loading="eager" '+
'onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';">'+

'<div '+
'class="articleImageFallback" '+
'style="display:none">'+

esc(
String(
a.category_slug ||
"ARTICLE"
).toUpperCase()
)+

"</div>";

}


/* =========================
   ARTICLE HTML
========================= */

state.innerHTML =

'<div class="articleMeta">'+

esc(
categoryLabel(
String(
a.category_slug || ""
).toLowerCase()
)
)+

" · "+

formatDate(a.created_at)+

"</div>"+


"<h1>"+
esc(
a.title ||
"Untitled Article"
)+
"</h1>"+


imageHTML+


(
a.excerpt
?

'<p class="articleExcerpt">'+
esc(a.excerpt)+
"</p>"

:

""

)+


'<div class="articleContent">'+

esc(
a.content ||
""
)+

"</div>"+


'<div class="articleStats">'+

'<div class="articleStat">'+

"👁️ Views: <b id=\"views\">"+
esc(a.views || 0)+
"</b>"+

"</div>"+


'<div class="articleStat">'+

"💬 Comments: <b id=\"commentCount\">0</b>"+

"</div>"+

"</div>";


/* =========================
   INCREMENT VIEW
========================= */

try{

const viewResult =
await sb.rpc(
"increment_article_view",
{
article_id:Number(id)
}
);


if(viewResult.error){

console.warn(
"View counter error:",
viewResult.error
);

}else{

const viewElement =
document.getElementById("views");


if(
viewElement &&
viewResult.data !== null &&
viewResult.data !== undefined
){

viewElement.textContent =
Number(viewResult.data)
.toLocaleString();

}

}

}catch(viewError){

console.warn(
"View counter unavailable:",
viewError
);

}


/* =========================
   COMMENTS
========================= */

await renderComments(
sb,
Number(id)
);

}catch(error){

console.error(
"Article error:",
error
);

state.innerHTML =
"<h2>Unable to load article</h2>"+
"<p>Please try again later.</p>";

}

}


/* =========================
   COMMENTS SYSTEM
========================= */

async function renderComments(
sb,
articleId
){

const box =
document.createElement("section");


box.className =
"comments";


box.innerHTML =

'<h2>💬 Comments / Ra’ayoyi</h2>'+


'<p class="commentIntro">'+

"Ka bar ra’ayinka a kasa. "+

"Comment ɗinka zai bayyana kai tsaye bayan ka tura shi."

+"</p>"+


'<form '+
'class="commentForm" '+
'id="commentForm">'+


'<label>'+

"Name"+

'<input '+
'id="commentName" '+
'type="text" '+
'maxlength="60" '+
'minlength="2" '+
'required '+
'autocomplete="name" '+
'placeholder="Your name">'+

"</label>"+


'<label>'+

"Email (optional)"+

'<input '+
'id="commentEmail" '+
'type="email" '+
'maxlength="120" '+
'autocomplete="email" '+
'placeholder="Your email (optional)">'+

"</label>"+


'<label>'+

"Comment / Ra’ayi"+

'<textarea '+
'id="commentText" '+
'maxlength="1000" '+
'minlength="2" '+
'required '+
'placeholder="Rubuta ra’ayinka a nan...">'+

"</textarea>"+

"</label>"+


'<label class="honeypot" aria-hidden="true">'+

"Website"+

'<input '+
'id="website" '+
'tabindex="-1" '+
'autocomplete="off">'+

"</label>"+


'<button '+
'type="submit" '+
'id="commentButton">'+

"Post Comment"+

"</button>"+


'<div '+
'class="commentStatus" '+
'id="commentStatus">'+

"</div>"+

"</form>"+


'<div '+
'class="commentList" '+
'id="commentList">'+

'<div class="emptyComments">'+

"Loading comments..."+

"</div>"+

"</div>";


state.appendChild(box);


/* =========================
   ELEMENTS
========================= */

const form =
document.getElementById(
"commentForm"
);


const nameInput =
document.getElementById(
"commentName"
);


const emailInput =
document.getElementById(
"commentEmail"
);


const textInput =
document.getElementById(
"commentText"
);


const spamInput =
document.getElementById(
"website"
);


const button =
document.getElementById(
"commentButton"
);


const status =
document.getElementById(
"commentStatus"
);


const list =
document.getElementById(
"commentList"
);


const countElement =
document.getElementById(
"commentCount"
);


/* =========================
   LOAD COMMENTS
========================= */

async function loadComments(){

list.innerHTML =
'<div class="emptyComments">'+
"Loading comments..."+
"</div>";


try{

const result =
await sb
.from("comments")
.select(
"id,article_id,name,email,body,status,created_at"
)
.eq("article_id",articleId)
.eq("status","approved")
.order(
"created_at",
{
ascending:false
}
);


if(result.error){

console.error(
"Comments load error:",
result.error
);

list.innerHTML =
'<div class="commentError">'+
"Comments ba su samu connection da database ba a yanzu."+
"</div>";

if(countElement){

countElement.textContent =
"0";

}

return;

}


const comments =
result.data || [];


/* =========================
   COMMENT COUNT
========================= */

if(countElement){

countElement.textContent =
comments.length
.toLocaleString();

}


if(!comments.length){

list.innerHTML =
'<div class="emptyComments">'+

"No comments yet. Be the first to comment!"+

"</div>";

return;

}


/* =========================
   RENDER COMMENTS
========================= */

list.innerHTML =
comments.map(function(c){

return (

'<article class="commentItem">'+

"<strong>"+
esc(
c.name ||
"Anonymous"
)+
"</strong>"+

'<div class="commentDate">'+
formatDate(c.created_at)+
"</div>"+

'<div class="commentText">'+
esc(
c.body ||
""
)+
"</div>"+

"</article>"

);

}).join("");


}catch(error){

console.error(
"Comments error:",
error
);

list.innerHTML =
'<div class="commentError">'+
"Unable to load comments right now."+
"</div>";

}

}


/* =========================
   POST COMMENT
========================= */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();


status.textContent =
"";


status.style.color =
"";


const name =
nameInput.value.trim();


const email =
emailInput.value.trim();


const body =
textInput.value.trim();


/* =========================
   HONEYPOT
========================= */

if(
spamInput.value.trim() !== ""
){

status.textContent =
"Comment could not be submitted.";

return;

}


/* =========================
   NAME VALIDATION
========================= */

if(name.length < 2){

status.textContent =
"Please enter your name.";

return;

}


if(name.length > 60){

status.textContent =
"Name is too long.";

return;

}


/* =========================
   EMAIL VALIDATION
========================= */

if(email.length > 120){

status.textContent =
"Email is too long.";

return;

}


if(
email &&
!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)
){

status.textContent =
"Please enter a valid email.";

return;

}


/* =========================
   COMMENT VALIDATION
========================= */

if(body.length < 2){

status.textContent =
"Please write a comment.";

return;

}


if(body.length > 1000){

status.textContent =
"Comment is too long.";

return;

}


/* =========================
   BUTTON
========================= */

button.disabled =
true;

button.textContent =
"Posting...";


status.textContent =
"Posting your comment...";


/* =========================
   INSERT DIRECTLY
========================= */

try{

const result =
await sb
.from("comments")
.insert({

article_id:
articleId,

name:
name,

email:
email ||
null,

body:
body,

/*
IMPORTANT:
Comment is approved immediately.
*/

status:
"approved"

});


if(result.error){

console.error(
"Comment insert error:",
result.error
);

status.textContent =
"An samu matsala wajen posting comment. Please try again.";

status.style.color =
"#a33";

return;

}


/* =========================
   SUCCESS
========================= */

status.textContent =
"✅ Comment posted successfully!";

status.style.color =
"#16803c";


/* Clear form */

form.reset();


/* Reload comments immediately */

await loadComments();


}catch(error){

console.error(
"Comment submit error:",
error
);

status.textContent =
"Unable to post comment right now.";

status.style.color =
"#a33";

}finally{

button.disabled =
false;

button.textContent =
"Post Comment";

}

});


/* =========================
   INITIAL COMMENTS
========================= */

await loadComments();

}


/* =========================
   START
========================= */

loadArticle();

})();

</script>

</body>
</html>
