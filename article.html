<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Article | Hamza S.S Kardam Writes</title>

<meta name="description" content="Read articles from Hamza S.S Kardam Writes.">
<meta name="robots" content="index,follow">
<meta name="theme-color" content="#0b1730">

<link rel="canonical" href="https://officialsalah001.github.io/kardam-writes/article.html">

<link rel="stylesheet" href="style.css">

<style>
.articlePage{
  width:min(850px,92%);
  margin:60px auto;
}

.articleMeta{
  color:#687386;
  font-size:12px;
  margin-bottom:10px;
}

.articleContent{
  font-size:18px;
  line-height:1.9;
  white-space:pre-wrap;
  word-wrap:break-word;
}

.articleHero{
  width:100%;
  max-height:430px;
  object-fit:cover;
  border-radius:14px;
  margin:20px 0;
}

.back{
  display:inline-block;
  margin-bottom:15px;
}

.articleExcerpt{
  font-size:17px;
  line-height:1.7;
  color:#4b5563;
  margin:15px 0 25px;
}

/* COMMENTS */
.comments{
  margin-top:45px;
  padding-top:30px;
  border-top:1px solid #e4e6eb;
}

.comments h2{
  margin-bottom:8px;
}

.commentIntro{
  color:#687386;
  line-height:1.6;
}

.commentForm{
  display:grid;
  gap:12px;
  margin:20px 0 30px;
}

.commentForm label{
  font-weight:700;
  font-size:14px;
}

.commentForm input,
.commentForm textarea{
  width:100%;
  box-sizing:border-box;
  margin-top:6px;
  padding:12px;
  border:1px solid #d9dde5;
  border-radius:8px;
  font:inherit;
  background:#fff;
}

.commentForm input:focus,
.commentForm textarea:focus{
  outline:2px solid #d7aa55;
  border-color:#d7aa55;
}

.commentForm textarea{
  min-height:120px;
  resize:vertical;
}

.commentForm button{
  justify-self:start;
  padding:12px 18px;
  border:0;
  border-radius:8px;
  background:#0b1730;
  color:#fff;
  font-weight:700;
  cursor:pointer;
}

.commentForm button:disabled{
  opacity:.6;
  cursor:not-allowed;
}

.commentStatus{
  font-size:13px;
  line-height:1.5;
}

.commentList{
  display:grid;
  gap:12px;
}

.commentItem{
  padding:16px;
  border:1px solid #e4e6eb;
  border-radius:10px;
  background:#fff;
}

.commentItem strong{
  display:block;
  margin-bottom:5px;
}

.commentDate{
  font-size:11px;
  color:#687386;
  margin-bottom:8px;
}

.commentText{
  white-space:pre-wrap;
  line-height:1.65;
  word-wrap:break-word;
}

.emptyComments{
  color:#687386;
  font-size:14px;
}

.commentError{
  padding:12px;
  border-radius:8px;
  background:#fff3f3;
  color:#8b1e1e;
  font-size:13px;
}

/* Anti-spam hidden field */
.honeypot{
  position:absolute!important;
  left:-9999px!important;
  width:1px!important;
  height:1px!important;
  overflow:hidden!important;
}
</style>
</head>

<body>

<header>
<div class="wrap nav">

<a class="logo" href="index.html">
<i>K</i>
<span>
Hamza S.S
<small>KARDAM WRITES</small>
</span>
</a>

<a class="wa" href="https://wa.me/2347077777636">
WhatsApp
</a>

</div>
</header>

<main class="articlePage">

<a class="back" href="index.html#articles">
← Back to articles
</a>

<div id="state">
Loading article...
</div>

</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="supabase-client.js"></script>

<script>
(function(){

const state=document.getElementById("state");

const id=new URLSearchParams(
window.location.search
).get("id");

if(!id){
state.innerHTML=
"<h2>Article not found</h2>"+
"<p>No article was selected.</p>";
return;
}

if(!window.kardamSupabase){
state.innerHTML=
"<h2>Connection error</h2>"+
"<p>Database connection is unavailable.</p>";
return;
}

const sb=window.kardamSupabase;

function esc(value=""){
return String(value).replace(/[&<>'"]/g,function(m){
return {
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
"'":"&#39;",
'"':"&quot;"
}[m];
});
}

function formatDate(date){
if(!date) return "";

try{
return new Date(date).toLocaleDateString(
"en-US",
{
year:"numeric",
month:"long",
day:"numeric"
}
);
}catch(e){
return "";
}
}

async function loadArticle(){

try{

const result=await sb
.from("articles")
.select("*")
.eq("id",id)
.eq("status","published")
.single();

if(result.error){

console.error(result.error);

state.innerHTML=
"<h2>Unable to load article</h2>"+
"<p>The article could not be loaded from the database.</p>";

return;
}

if(!result.data){

state.innerHTML=
"<h2>Article not found</h2>"+
"<p>This article is not available.</p>";

return;
}

const a=result.data;

document.title=
(a.title||"Article")+
" | Hamza S.S Kardam Writes";

const description=
String(a.excerpt||a.content||"")
.replace(/\s+/g," ")
.substring(0,155);

const metaDescription=
document.querySelector(
'meta[name="description"]'
);

if(metaDescription){
metaDescription.content=description;
}

state.innerHTML=

'<div class="articleMeta">'+
esc(a.category_slug||"Article")+
" · "+
formatDate(a.created_at)+
"</div>"+

"<h1>"+
esc(a.title||"Untitled Article")+
"</h1>"+

(a.image_url
?
'<img class="articleHero" src="'+
esc(a.image_url)+
'" alt="'+
esc(a.title||"Article")+
'" loading="eager">'
:
""
)+

(a.excerpt
?
'<p class="articleExcerpt">'+
esc(a.excerpt)+
"</p>"
:
""
)+

'<div class="articleContent">'+
esc(a.content||"")+
"</div>"+

'<p class="articleMeta">'+
"Views: <span id=\"views\">"+
esc(a.views||0)+
"</span>"+
"</p>";

/* VIEW COUNTER */

try{

const view=await sb.rpc(
"increment_article_view",
{
article_id:Number(id)
}
);

if(
!view.error &&
view.data!==null &&
document.getElementById("views")
){

document.getElementById("views").textContent=
view.data;

}

}catch(viewError){

console.warn(
"View counter unavailable:",
viewError
);

}

/* COMMENTS */

await renderComments(
sb,
Number(id)
);

}catch(error){

console.error(
"Article error:",
error
);

state.innerHTML=
"<h2>Unable to load article</h2>"+
"<p>Please try again later.</p>";

}

}

/* =========================
   COMMENTS
========================= */

async function renderComments(
sb,
articleId
){

const box=document.createElement("section");

box.className="comments";

box.innerHTML=

'<h2>💬 Comments / Ra’ayoyi</h2>'+

'<p class="commentIntro">'+
"Ka bar ra’ayinka a kasa. "+
"Comments masu amfani suna taimaka wajen gina al’umma."
+"</p>"+

'<form class="commentForm" id="commentForm">'+

'<label>'+
"Name"+
'<input '+
'id="commentName" '+
'type="text" '+
'maxlength="60" '+
'minlength="2" '+
'required '+
'autocomplete="name" '+
'placeholder="Your name">'+
'</label>'+

'<label>'+
"Comment / Ra’ayi"+
'<textarea '+
'id="commentText" '+
'maxlength="1000" '+
'minlength="2" '+
'required '+
'placeholder="Rubuta ra’ayinka a nan...">'+
'</textarea>'+
'</label>'+

'<label class="honeypot" aria-hidden="true">'+
"Website"+
'<input '+
'id="website" '+
'tabindex="-1" '+
'autocomplete="off">'+
'</label>'+

'<button type="submit" id="commentButton">'+
"Post Comment"+
"</button>"+

'<div class="commentStatus" id="commentStatus"></div>'+

"</form>"+

'<div class="commentList" id="commentList">'+
'<div class="emptyComments">Loading comments...</div>'+
"</div>";

state.appendChild(box);

const form=document.getElementById(
"commentForm"
);

const nameInput=document.getElementById(
"commentName"
);

const textInput=document.getElementById(
"commentText"
);

const spamInput=document.getElementById(
"website"
);

const button=document.getElementById(
"commentButton"
);

const status=document.getElementById(
"commentStatus"
);

const list=document.getElementById(
"commentList"
);

/* LOAD COMMENTS */

async function loadComments(){

list.innerHTML=
'<div class="emptyComments">Loading comments...</div>';

try{

const result=await sb
.from("comments")
.select(
"id,article_id,name,comment,created_at"
)
.eq("article_id",articleId)
.order(
"created_at",
{
ascending:false
}
);

if(result.error){

console.error(
"Comments load error:",
result.error
);

list.innerHTML=
'<div class="commentError">'+
"Comments ba su samu connection da database ba a yanzu."+
"</div>";

return;
}

const comments=result.data||[];

if(!comments.length){

list.innerHTML=
'<div class="emptyComments">'+
"No comments yet. Be the first to comment!"+
"</div>";

return;
}

list.innerHTML=comments.map(function(c){

return (

'<article class="commentItem">'+

"<strong>"+
esc(c.name||"Anonymous")+
"</strong>"+

'<div class="commentDate">'+
formatDate(c.created_at)+
"</div>"+

'<div class="commentText">'+
esc(c.comment||"")+
"</div>"+

"</article>"

);

}).join("");

}catch(error){

console.error(
"Comments error:",
error
);

list.innerHTML=
'<div class="commentError">'+
"Unable to load comments right now."+
"</div>";

}

}

/* POST COMMENT */

form.addEventListener(
"submit",
async function(e){

e.preventDefault();

status.textContent="";
status.style.color="";

const name=nameInput.value.trim();
const comment=textInput.value.trim();

/* Honeypot */

if(spamInput.value.trim()!==""){

status.textContent=
"Comment could not be submitted.";

return;
}

/* Validation */

if(name.length<2){

status.textContent=
"Please enter your name.";

return;
}

if(name.length>60){

status.textContent=
"Name is too long.";

return;
}

if(comment.length<2){

status.textContent=
"Please write a comment.";

return;
}

if(comment.length>1000){

status.textContent=
"Comment is too long.";

return;
}

button.disabled=true;
button.textContent=
"Posting...";

status.textContent=
"Submitting your comment...";

try{

const result=await sb
.from("comments")
.insert({
article_id:articleId,
name:name,
comment:comment
});

if(result.error){

console.error(
"Comment insert error:",
result.error
);

status.textContent=
"An samu matsala wajen posting comment. Please try again.";

return;
}

/* SUCCESS */

form.reset();

status.textContent=
"✅ Comment posted successfully!";

status.style.color=
"#16803c";

await loadComments();

}catch(error){

console.error(
"Comment submit error:",
error
);

status.textContent=
"Unable to post comment right now.";

}finally{

button.disabled=false;
button.textContent=
"Post Comment";

}

});

/* Initial comments load */

await loadComments();

}

/* START */

loadArticle();

})();
</script>

</body>
</html>
